apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "switchyard.fullname" . }}-test
  namespace: {{ include "switchyard.namespace" . }}
  labels:
    {{- include "switchyard.labels" (dict "root" . "component" "test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: hook-succeeded,hook-failed
data:
  run.sh: |
    set -eu
    echo "Checking switchyard /health ..."
    curl -fsS --max-time 10 "http://{{ include "switchyard.fullname" . }}:{{ .Values.switchyard.port }}/health"
    echo "Checking configurator /api/health ..."
    curl -fsS --max-time 10 "http://{{ include "configurator.fullname" . }}:{{ .Values.configurator.port }}/api/health"
    echo "All health checks passed."
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "switchyard.fullname" . }}-test
  namespace: {{ include "switchyard.namespace" . }}
  labels:
    {{- include "switchyard.labels" (dict "root" . "component" "test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: hook-succeeded,hook-failed
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      imagePullPolicy: IfNotPresent
      command: ["sh", "/tests/run.sh"]
      securityContext:
        # curlimages/curl runs as uid 100 (USER curl_user is non-numeric,
        # so runAsNonRoot needs the explicit numeric id).
        runAsNonRoot: true
        runAsUser: 100
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: tests
          mountPath: /tests
          readOnly: true
  volumes:
    - name: tests
      configMap:
        name: {{ include "switchyard.fullname" . }}-test
  restartPolicy: Never
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "switchyard.configMapName" . }}
  namespace: {{ include "switchyard.namespace" . }}
  labels:
    {{- include "switchyard.labels" (dict "root" . "component" "server") | nindent 4 }}

{{- /* The configurator rewrites routes.toml (and adds provider_meta.json) in
     this ConfigMap whenever the user saves. Helm 4 upgrades with server-side
     apply, so once the ConfigMap exists we must stop rendering the default
     here or every upgrade conflicts with (or clobbers) the saved config. */}}
{{- $existing := lookup "v1" "ConfigMap" (include "switchyard.namespace" .) (include "switchyard.configMapName" .) }}
{{- if not $existing }}
data:
  routes.toml: |
{{ .Values.routesToml | nindent 4 }}
{{- end }}
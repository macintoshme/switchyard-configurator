{{- /*
Optional override for the model hints definitions shown in the
configurator's Models tab. Rendered from values.modelHints and mounted
over the file baked into the image (MODEL_HINTS_FILE env var); empty by
default, in which case the baked definitions are used.
*/ -}}
{{- if .Values.modelHints }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "configurator.fullname" . }}-model-hints
  namespace: {{ include "switchyard.namespace" . }}
  labels:
    {{- include "switchyard.labels" (dict "root" . "component" "configurator") | nindent 4 }}
data:
  model_hints.toml: |
{{ .Values.modelHints | nindent 4 }}
{{- end }}
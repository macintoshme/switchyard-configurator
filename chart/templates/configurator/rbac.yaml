apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "configurator.fullname" . }}
  namespace: {{ include "switchyard.namespace" . }}
  labels:
    {{- include "switchyard.labels" (dict "root" . "component" "configurator") | nindent 4 }}
rules:
  # Least privilege: only the shared config ConfigMaps, only read/patch.
  # (list/watch are omitted because resourceNames cannot restrict them.)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "patch", "update"]
    resourceNames:
      - {{ include "switchyard.configMapName" . }}
      - {{ include "switchyard.seedConfigMapName" . }}
  # Recreating the runtime ConfigMap when it was deleted at runtime.
  # create cannot be scoped with resourceNames (the name is not part of
  # the request path), so this grants creating configmaps only.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  {{- if include "switchyard.tokenSecretEnabled" . }}
  # Provider tokens entered in the web UI are upserted into the
  # UI-managed token Secret on save.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch", "update"]
    resourceNames:
      - {{ include "switchyard.tokenSecretName" . }}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "configurator.fullname" . }}
  namespace: {{ include "switchyard.namespace" . }}
  labels:
    {{- include "switchyard.labels" (dict "root" . "component" "configurator") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "configurator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "configurator.fullname" . }}
    namespace: {{ include "switchyard.namespace" . }}
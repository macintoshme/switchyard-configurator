apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "configurator.fullname" . }}
  namespace: {{ include "switchyard.namespace" . }}
  labels:
    {{- include "switchyard.labels" (dict "root" . "component" "configurator") | nindent 4 }}
spec:
  # Single writer: the configurator PATCHes the shared ConfigMap.
  replicas: 1
  selector:
    matchLabels:
      {{- include "switchyard.selectorLabels" (dict "root" . "component" "configurator") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "switchyard.labels" (dict "root" . "component" "configurator") | nindent 8 }}
      annotations:
        # Roll the configurator when the code-maintained seed config changes
        # so the boot-time seed sync applies it (switchyard_config/kube.py).
        checksum/seed-config: {{ .Values.routesToml | sha256sum }}
        # Roll when the model hints override changes (constant when unset).
        checksum/model-hints: {{ .Values.modelHints | sha256sum }}
    spec:
      serviceAccountName: {{ include "configurator.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.configurator.uid }}
        runAsGroup: {{ .Values.configurator.gid }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: configurator
          image: "{{ include "configurator.image" . }}"
          imagePullPolicy: {{ .Values.configurator.pullPolicy }}
          env:
            - name: CONFIGURATOR_PORT
              value: "{{ .Values.configurator.port }}"
            - name: CONFIGMAP_NAME
              value: {{ include "switchyard.configMapName" . }}
            - name: SEED_CONFIGMAP_NAME
              value: {{ include "switchyard.seedConfigMapName" . }}
            - name: DEPLOYMENT_PLATFORM
              value: kubernetes
            - name: CONFIGURATOR_DRAFT_DIR
              value: /data
            - name: SWITCHYARD_URL
              value: "http://{{ include "switchyard.fullname" . }}:{{ .Values.switchyard.port }}"
            {{- if include "switchyard.tokenSecretEnabled" . }}
            - name: TOKEN_SECRET_NAME
              value: {{ include "switchyard.tokenSecretName" . }}
            {{- end }}
            {{- if .Values.modelHints }}
            - name: MODEL_HINTS_FILE
              value: /etc/switchyard/model-hints/model_hints.toml
            {{- end }}
            {{- include "switchyard.providerEnv" $ | nindent 12 }}
          {{- if include "switchyard.tokenSecretEnabled" . }}
          # Tokens saved from the web UI: envFrom re-reads them here after
          # a configurator restart so the provider forms repopulate.
          envFrom:
            - secretRef:
                name: {{ include "switchyard.tokenSecretName" . }}
                optional: true
          {{- end }}
          ports:
            - containerPort: {{ .Values.configurator.port }}
          volumeMounts:
            - name: drafts
              mountPath: /data
            {{- if .Values.modelHints }}
            - name: model-hints
              mountPath: /etc/switchyard/model-hints
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.configurator.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.configurator.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: drafts
          emptyDir: {}
        {{- if .Values.modelHints }}
        - name: model-hints
          configMap:
            name: {{ include "configurator.fullname" . }}-model-hints
        {{- end }}
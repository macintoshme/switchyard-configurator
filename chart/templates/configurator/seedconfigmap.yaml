{{- /*
Code-maintained seed for the runtime config ConfigMap: always rendered
from values.routesToml, fully Helm-owned (the configurator never writes
it, so upgrades cannot conflict). The configurator applies it to the
runtime ConfigMap at boot whenever its content changed — unchanged, the
UI-saved runtime config wins (see switchyard_config/kube.py sync_seed).
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "switchyard.seedConfigMapName" . }}
  namespace: {{ include "switchyard.namespace" . }}
  labels:
    {{- include "switchyard.labels" (dict "root" . "component" "server") | nindent 4 }}
data:
  routes.toml: |
{{ .Values.routesToml | nindent 4 }}
{{- if .Values.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "switchyard.fullname" . }}-dashboard
  namespace: {{ include "switchyard.namespace" . }}
  labels:
    {{- include "switchyard.labels" (dict "root" . "component" "server") | nindent 4 }}
    # Discovered by the Grafana dashboard sidecar (enabled by default in
    # kube-prometheus-stack).
    grafana_dashboard: "1"
    {{- with .Values.grafanaDashboard.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
{{ (.Files.Glob "files/grafana/dashboards/*.json").AsConfig | indent 2 }}
{{- end }}
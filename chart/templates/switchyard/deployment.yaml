apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "switchyard.fullname" . }}
  namespace: {{ include "switchyard.namespace" . }}
  labels:
    {{- include "switchyard.labels" (dict "root" . "component" "server") | nindent 4 }}
  {{- if .Values.reloader.enabled }}
  annotations:
    reloader.stakater.com/auto: "true"
  {{- end }}
spec:
  replicas: {{ .Values.switchyard.replicaCount }}
  selector:
    matchLabels:
      {{- include "switchyard.selectorLabels" (dict "root" . "component" "server") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "switchyard.labels" (dict "root" . "component" "server") | nindent 8 }}
      annotations:
        # Roll pods on ConfigMap changes even without Stakater Reloader.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: switchyard
          image: "{{ include "switchyard.image" . }}"
          imagePullPolicy: {{ .Values.switchyard.pullPolicy }}
          # The image's ENTRYPOINT is `switchyard-server` with no default
          # args; --config is required and no port is read from the env.
          args:
            - --config
            - /etc/switchyard/routes.toml
            - --port
            - "{{ .Values.switchyard.port }}"
          ports:
            - containerPort: {{ .Values.switchyard.port }}
          env:
            {{- include "switchyard.providerEnv" $ | nindent 12 }}
          {{- if include "switchyard.tokenSecretEnabled" . }}
          # Provider tokens entered in the configurator web UI: the
          # configurator upserts them into this Secret on save; Stakater
          # Reloader (auto mode) rolls the pods when it changes.
          envFrom:
            - secretRef:
                name: {{ include "switchyard.tokenSecretName" . }}
                optional: true
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/switchyard
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.switchyard.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.switchyard.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: {{ include "switchyard.configMapName" . }}
            items:
              - key: routes.toml
                path: routes.toml
# Default values for switchyard.

# Dedicated namespace for all chart resources. The chart creates it by
# default; `helm uninstall` removes it (and everything in it). Set
# `name: ""` to deploy into the helm release namespace (-n) instead, and
# `create: false` when pointing at a pre-existing namespace.
namespace:
  create: true
  name: switchyard

# Override the chart name in resource names (optional).
nameOverride: ""
# Fully override the generated resource names (optional).
fullnameOverride: ""

# routes.toml maintained in code. At install this seeds the runtime config
# ConfigMap; afterwards the configurator watches this seed (rendered into
# the <release>-config-seed ConfigMap): when this value changes, the next
# configurator start applies it to the runtime ConfigMap — overriding
# UI-saved edits. Unchanged, UI edits keep winning.
#   helm upgrade --install switchyard ./chart --set-file routesToml=routes.toml
routesToml: |
  schema_version = 1

  [llm_clients.local]
  format = "openai_chat"
  base_url = "http://localhost:11434/v1"
  max_retries = 2

  [targets.default]
  id = "default-model"
  llm_client = "local"

  [routes.default]
  id = "default-model"
  type = "passthrough"
  target = "default"

# Optional override for the configurator's model hints definitions (the
# Models tab's capability suggestions). Empty = use the definitions baked
# into the configurator image (configurator/model_hints.toml). When set,
# the content is rendered into a ConfigMap and mounted over the baked file
# (MODEL_HINTS_FILE), so suggestions can be tuned without an image rebuild:
#   helm upgrade switchyard ./chart --set-file modelHints=model_hints.toml
modelHints: ""

# Provider definitions – metadata only; tokens stay in Kubernetes Secrets and
# are injected into the switchyard container as environment variables via
# secretKeyRef. Each entry needs:
#   envVar:    environment variable name for the API key (e.g. MY_PROVIDER_TOKEN)
#   secret:    name of the Kubernetes Secret that stores the token
#   secretKey: key inside the Secret (default "token")
providers: []

# Optional image pull secrets for private registries; applied to both
# deployments. Example:
#   imagePullSecrets:
#     - name: my-registry-cred
imagePullSecrets: []

# Switchyard deployment settings
switchyard:
  replicaCount: 1
  image:
    # Published by the switchyard fork's image pipeline (ghcr, public).
    # `main` rolls with every push to the fork; pin with `sha-<commit>` or
    # an upstream release tag (`vX.Y.Z`).
    registry: ghcr.io
    repository: macintoshme/nemo-switchyard
    tag: main
  # Always re-resolve the rolling `main` tag on pod start.
  pullPolicy: Always
  port: 4000
  # Resource guidance — the Rust server is lightweight; raise for high
  # throughput. Example:
  #   resources:
  #     requests: {cpu: 100m, memory: 128Mi}
  #     limits: {cpu: "1", memory: 256Mi}
  resources: {}

# Configurator deployment settings. In Kubernetes the configurator reads and
# writes the config ConfigMap via its service account (Role/RoleBinding are
# created by the chart); provider tokens reach it via secretKeyRef env vars.
configurator:
  replicaCount: 1
  image:
    # Published by this repo's release pipeline (ghcr, public); pinned to
    # the chart's configurator version.
    registry: ghcr.io
    repository: macintoshme/nemo-switchyard-configurator
    tag: v0.2.6
  pullPolicy: IfNotPresent
  port: 8080
  uid: 1000
  gid: 1000
  # Provider tokens entered in the web UI are persisted into a Secret
  # (default: <release>-tokens) that the configurator creates and updates
  # on save; both deployments load it via envFrom, so the switchyard
  # server sees the tokens as environment variables and the configurator
  # re-reads them after pod restarts. Stakater Reloader (auto mode) rolls
  # the switchyard pods when the Secret changes. Disable to manage tokens
  # purely via the providers: secretKeyRef entries above instead.
  tokenSecret:
    enabled: true
    # name: my-tokens
  # Resource guidance — the FastAPI configurator is idle most of the time.
  # Example:
  #   resources:
  #     requests: {cpu: 50m, memory: 64Mi}
  #     limits: {cpu: 200m, memory: 128Mi}
  resources: {}

# Service type – ClusterIP by default; override if external exposure needed.
serviceType: ClusterIP

# Prometheus Operator ServiceMonitor – opt-in; requires a Prometheus Operator
# installation in the cluster. When enabled, Prometheus scrapes /metrics.
serviceMonitor:
  enabled: false
  interval: 30s
  additionalLabels: {}

# Grafana dashboard – opt-in; requires a Grafana instance with the dashboard
# sidecar (kube-prometheus-stack default). When enabled, the dashboard is
# shipped as a ConfigMap with sidecar discovery labels.
grafanaDashboard:
  enabled: false
  additionalLabels: {}

# Annotations for Stakater reloader – switchyard pod will be restarted on ConfigMap changes.
reloader:
  enabled: true

# Continuous validation for pull requests and pushes to main.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r configurator/requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests/ -q

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          # Keep in sync with the helm version the chart is developed
          # against (v4.x line).
          version: latest
      - name: Lint chart
        run: helm lint chart
      - name: Render default manifests
        run: helm template ci chart > /dev/null
      - name: Render opt-in manifests
        run: |
          helm template ci chart \
            --set serviceMonitor.enabled=true \
            --set grafanaDashboard.enabled=true \
            --set reloader.enabled=true > /dev/null
      - name: Render example routes
        run: |
          helm template ci chart \
            --set-file routesToml=switchyard/config/routes.toml.example \
            > /dev/null
      - name: Schema rejects bad values
        run: |
          ! helm template ci chart --set serviceType=NotAType > /dev/null
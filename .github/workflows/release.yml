# Release pipeline: on a v* tag push, build and push the configurator
# image to ghcr.io. The server image is built by the Switchyard fork's own
# pipeline, and the Helm chart is published from the switchyard-helm repo.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert git tag is a stable version
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG"
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::git tag $TAG is not of the form vX.Y.Z" && exit 1
          fi

  configurator-image:
    needs: version-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # The build context is the repo root because the image also
          # copies the shared switchyard_config/ package.
          context: .
          file: configurator/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/nemo-switchyard-configurator:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/nemo-switchyard-configurator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
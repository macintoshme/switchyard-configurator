# Release pipeline: on a v* tag push, verify version sync, then build and
# push both container images and the Helm chart to ghcr.io.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  version-sync:
    runs-on: ubuntu-latest
    outputs:
      # Upstream server version the nemo-switchyard image builds (ARG
      # default in switchyard/Dockerfile) — NOT the release tag: this
      # repo's versions track the configurator + chart, while the Rust
      # server only moves when upstream cuts a release.
      upstream: ${{ steps.versions.outputs.upstream }}
    steps:
      - uses: actions/checkout@v4
      - name: Assert git tag matches chart versions
        id: versions
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          APPVERSION="$(awk '/^appVersion:/{print $2; exit}' chart/Chart.yaml)"
          CHARTVERSION="$(awk '/^version:/{print $2; exit}' chart/Chart.yaml)"
          CFGTAG="$(awk '/^configurator:/{f=1} f && /tag:/{print $2; exit}' chart/values.yaml)"
          UPSTREAM="$(awk '/^ARG SWITCHYARD_VERSION=/{sub(/^ARG SWITCHYARD_VERSION=/, ""); print; exit}' switchyard/Dockerfile)"
          echo "tag=$TAG appVersion=$APPVERSION chartVersion=$CHARTVERSION configuratorTag=$CFGTAG upstream=$UPSTREAM"
          if [ "${TAG#v}" != "$CHARTVERSION" ]; then
            echo "::error::git tag $TAG does not match chart version $CHARTVERSION (without the v prefix)" && exit 1
          fi
          if [ "$TAG" != "$APPVERSION" ]; then
            echo "::error::git tag $TAG does not match chart appVersion $APPVERSION" && exit 1
          fi
          if [ "$TAG" != "$CFGTAG" ]; then
            echo "::error::git tag $TAG does not match configurator image tag $CFGTAG in values.yaml" && exit 1
          fi
          # Fail fast (with a clear message) if the pinned upstream tag
          # does not exist, instead of failing deep inside the Rust build.
          if ! git ls-remote --tags https://github.com/NVIDIA-NeMo/Switchyard.git \
                | grep -q "refs/tags/${UPSTREAM}\$"; then
            echo "::error::pinned upstream tag $UPSTREAM (switchyard/Dockerfile) does not exist at NVIDIA-NeMo/Switchyard" && exit 1
          fi
          echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"

  images:
    needs: version-sync
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nemo-switchyard
            context: switchyard/
            file: switchyard/Dockerfile
            # Builds the pinned upstream tag (see version-sync output).
            build-args: SWITCHYARD_VERSION=${{ needs.version-sync.outputs.upstream }}
          - name: nemo-switchyard-configurator
            # The configurator build context is the repo root because the
            # image also copies the shared switchyard_config/ package.
            context: .
            file: configurator/Dockerfile
            build-args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    needs: version-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: latest
      - name: Package chart
        run: helm package chart
      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} \
            --username "${{ github.actor }}" --password-stdin
      - name: Push chart
        run: |
          helm push switchyard-*.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts
# Release pipeline: on a v* tag push, verify version sync, then build and
# push the configurator image and the Helm chart to ghcr.io. The server
# image is built by the Switchyard fork's own pipeline instead.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert git tag matches chart versions
        id: versions
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          APPVERSION="$(awk '/^appVersion:/{print $2; exit}' chart/Chart.yaml)"
          CHARTVERSION="$(awk '/^version:/{print $2; exit}' chart/Chart.yaml)"
          CFGTAG="$(awk '/^configurator:/{f=1} f && /tag:/{print $2; exit}' chart/values.yaml)"
          echo "tag=$TAG appVersion=$APPVERSION chartVersion=$CHARTVERSION configuratorTag=$CFGTAG"
          if [ "${TAG#v}" != "$CHARTVERSION" ]; then
            echo "::error::git tag $TAG does not match chart version $CHARTVERSION (without the v prefix)" && exit 1
          fi
          if [ "$TAG" != "$APPVERSION" ]; then
            echo "::error::git tag $TAG does not match chart appVersion $APPVERSION" && exit 1
          fi
          if [ "$TAG" != "$CFGTAG" ]; then
            echo "::error::git tag $TAG does not match configurator image tag $CFGTAG in values.yaml" && exit 1
          fi

  configurator-image:
    needs: version-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # The build context is the repo root because the image also
          # copies the shared switchyard_config/ package.
          context: .
          file: configurator/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/nemo-switchyard-configurator:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/nemo-switchyard-configurator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    needs: version-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: latest
      - name: Package chart
        run: helm package chart
      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} \
            --username "${{ github.actor }}" --password-stdin
      - name: Push chart
        run: |
          helm push switchyard-*.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts